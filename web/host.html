<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SatuSuara · Host</title>
<style>
:root{--ink:#0f1318;--surface:#171c24;--line:#2a313c;--text:#e9edf2;--muted:#8c96a5;--amber:#f0b34a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:1.5rem;background:var(--ink);color:var(--text);
  font:16px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:44rem;margin:0 auto}
h1{margin:0 0 1.25rem;font-size:1.5rem}
.label{color:var(--muted);font-size:.9rem;margin:1.25rem 0 .25rem}
.code{font-size:2.5rem;font-weight:650;letter-spacing:.3em;color:var(--amber);font-variant-numeric:tabular-nums}
code{display:block;padding:.6rem .8rem;background:var(--surface);border:1px solid var(--line);
  border-radius:.5rem;overflow-wrap:anywhere}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>SatuSuara, dashboard host</h1>
  <div class="label">Kode gabung</div>
  <div id="code" class="code">----</div>
  <div class="label">Tautan penerima</div>
  <code id="url">…</code>
  <div class="label">Alamat pendek untuk laptop</div>
  <code id="short">…</code>
  <div class="label">Perangkat terhubung</div>
  <div class="wrap">
    <table>
      <thead><tr><th>Nama</th><th>Jenis</th><th>IP</th><th>Tersambung</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">Belum ada perangkat.</td></tr></tbody>
    </table>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function td(text) { const c = document.createElement("td"); c.textContent = text; return c; }
async function refresh() {
  try {
    const s = await (await fetch("/api/host/state", { cache: "no-store" })).json();
    $("code").textContent = s.code;
    $("url").textContent = s.url;
    $("short").textContent = s.short;
    const rows = $("rows");
    rows.replaceChildren();
    if (!s.clients.length) {
      const tr = document.createElement("tr");
      const c = td("Belum ada perangkat."); c.colSpan = 4; c.className = "empty";
      tr.append(c); rows.append(tr);
    }
    for (const c of s.clients) {
      const tr = document.createElement("tr");
      tr.append(td(c.name), td(c.kind), td(c.ip), td(c.connected_s + " dtk"));
      rows.append(tr);
    }
  } catch (e) { /* server berhenti */ }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
