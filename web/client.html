<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1318">
<title>SatuSuara</title>
<style>
:root{
  --ink:#0f1318; --surface:#171c24; --line:#2a313c;
  --text:#e9edf2; --muted:#8c96a5;
  --amber:#f0b34a; --ok:#58c98a; --bad:#ef6b5f; --busy:#8c96a5;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  background:var(--ink); color:var(--text);
  font:16px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app{
  min-height:100vh; min-height:100dvh;
  max-width:28rem; margin:0 auto;
  padding:max(1.25rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom));
  display:flex; flex-direction:column;
}
.brand{font-weight:650; letter-spacing:.01em; color:var(--muted)}
.screen{flex:1; display:flex; flex-direction:column}
.who{padding-top:1.5rem}
.who h1{margin:0; font-size:1.75rem; line-height:1.2; font-weight:650}
.muted{color:var(--muted); margin:.4rem 0 0}
.status{display:flex; align-items:center; gap:.5rem; margin:.5rem 0 0; color:var(--muted)}
.dot{width:.6rem; height:.6rem; border-radius:50%; background:var(--busy); flex:none}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.stage{flex:1; display:grid; place-items:center; align-content:center; gap:1.25rem}

.join{
  position:relative;
  width:min(62vw,15rem); aspect-ratio:1; border-radius:50%;
  border:2px solid var(--amber); background:transparent; color:var(--amber);
  font:inherit; font-size:1.6rem; font-weight:650; cursor:pointer;
  box-shadow:0 0 0 .9rem rgba(240,179,74,.08), 0 0 0 1.8rem rgba(240,179,74,.04);
  transition:transform .12s ease, background-color .2s ease, color .2s ease;
}
.join:active{transform:scale(.97)}
.join.on{background:var(--amber); color:var(--ink); cursor:default}
.join.ripple::after{
  content:""; position:absolute; inset:-2px; border-radius:50%;
  border:2px solid var(--amber); opacity:0;
  animation:ripple 1.1s ease-out 1;
}
@keyframes ripple{from{transform:scale(1);opacity:.7} to{transform:scale(1.6);opacity:0}}

.info{min-height:1.5rem; margin:0 0 .5rem; color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums}

.code{
  width:100%; max-width:15rem; padding:.75rem 1rem; text-align:center;
  font:inherit; font-size:2.25rem; font-weight:650; letter-spacing:.5em; text-indent:.5em;
  font-variant-numeric:tabular-nums;
  color:var(--text); background:var(--surface);
  border:1px solid var(--line); border-radius:.75rem;
}
.code::placeholder{color:var(--line)}
.error{min-height:1.5rem; margin:0; color:var(--bad); text-align:center}
.primary{
  width:100%; max-width:15rem; padding:.85rem 1rem; border:0; border-radius:.75rem;
  background:var(--amber); color:var(--ink); font:inherit; font-weight:650; cursor:pointer;
}
.primary:disabled{opacity:.5; cursor:default}
.ghost{
  width:100%; padding:.8rem 1rem; border:1px solid var(--line); border-radius:.75rem;
  background:var(--surface); color:var(--text); font:inherit; font-weight:600; cursor:pointer;
}
.ghost:active{transform:scale(.99)}

button:focus-visible, input:focus-visible{outline:3px solid var(--text); outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .join, .join.ripple::after{transition:none; animation:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="brand">SatuSuara</div>

  <section id="screen-code" class="screen" hidden>
    <div class="who">
      <h1>Masukkan kode gabung</h1>
      <p class="muted">Kode 4 digit tampil di layar PC host.</p>
    </div>
    <div class="stage">
      <input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9]*"
             maxlength="4" autocomplete="off" placeholder="0000" aria-label="Kode gabung 4 digit">
      <p id="code-error" class="error" role="alert"></p>
      <button id="btn-code" class="primary" type="button">Masuk</button>
    </div>
  </section>

  <section id="screen-main" class="screen" hidden>
    <div class="who">
      <h1 id="device-name">&nbsp;</h1>
      <p class="status"><span id="dot" class="dot"></span><span id="status-text">Menyambung…</span></p>
    </div>
    <div class="stage">
      <button id="btn-join" class="join" type="button"><span id="join-label">Gabung</span></button>
    </div>
    <p id="info" class="info" role="status"></p>
    <button id="btn-test" class="ghost" type="button" hidden>Tes Bunyi</button>
    <p id="test-line" class="info" role="status"></p>
  </section>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// localStorage bisa gagal (mode privat, dll). Selalu bungkus.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* abaikan */ } },
};

// Halaman jalan di http:// LAN (bukan secure context): crypto.randomUUID tidak ada,
// getRandomValues tetap ada.
function deviceId() {
  let id = store.get("ss_device_id");
  if (!id) {
    const b = new Uint8Array(8);
    crypto.getRandomValues(b);
    id = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    store.set("ss_device_id", id);
  }
  return id;
}

let token = new URLSearchParams(location.search).get("t");
let ws = null, retries = 0, retryTimer = null;
let joined = false, audioCtx = null, clickBuf = null;
let connected = false;

// ---- Sinkron jam (PRD 8.2) -------------------------------------------------
// Jam server = performance.now() + clockOffset (semua dalam ms).
const MAX_SAMPLES = 24, MIN_SAMPLES = 5, BURST = 15;
let samples = [], clockOffset = null, bestRtt = null;
let burstTimer = null, pingTimer = null;
let manualOffsetMs = 0;          // M2: slider offset per perangkat
let lateClicks = 0;

function stopSync() {
  clearInterval(burstTimer); clearInterval(pingTimer);
  burstTimer = pingTimer = null;
}

function sendPing() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping", t0: performance.now() }));
}

function startSync() {
  stopSync();
  samples = []; clockOffset = null; bestRtt = null;
  let n = 0;
  burstTimer = setInterval(() => {
    sendPing();
    if (++n >= BURST) {
      clearInterval(burstTimer); burstTimer = null;
      pingTimer = setInterval(sendPing, 5000);
    }
  }, 60);
}

function onPong(m) {
  const t1 = performance.now();
  const rtt = t1 - m.t0;
  if (!(rtt >= 0 && rtt < 2000)) return;
  samples.push({ rtt, offset: m.ts + rtt / 2 - t1 });
  if (samples.length > MAX_SAMPLES) samples.shift();

  // Ambil 3 sampel ber-RTT terkecil (paling sedikit terganggu jitter), rata-ratakan offsetnya.
  const best = samples.slice().sort((a, b) => a.rtt - b.rtt).slice(0, 3);
  const target = best.reduce((s, x) => s + x.offset, 0) / best.length;
  bestRtt = best[0].rtt;
  if (clockOffset === null || Math.abs(target - clockOffset) > 100) clockOffset = target;
  else clockOffset += 0.3 * (target - clockOffset);   // haluskan agar tidak melompat
  renderStatus();
}

function synced() { return clockOffset !== null && samples.length >= MIN_SAMPLES; }

// ---- Status ----------------------------------------------------------------
function setStatus(kind, text) {
  $("dot").className = "dot " + kind;
  $("status-text").textContent = text;
}

function renderStatus() {
  if (!connected) return;
  if (synced()) setStatus("ok", `Sinkron ±${Math.max(1, Math.round(bestRtt / 2))} ms`);
  else setStatus("ok", "Tersambung, menyinkronkan jam…");
}

function show(name) {
  $("screen-code").hidden = name !== "code";
  $("screen-main").hidden = name !== "main";
}

// ---- Audio: klik terjadwal -------------------------------------------------
function makeClick(ctx) {
  const sr = ctx.sampleRate, n = Math.floor(sr * 0.03);
  const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    const t = i / sr;
    d[i] = Math.sin(2 * Math.PI * 1800 * t) * Math.exp(-t / 0.004) * 0.9;
  }
  return buf;
}

// Ubah waktu perf (ms) saat suara harus KELUAR dari speaker menjadi waktu AudioContext.
// getOutputTimestamp() sudah memperhitungkan latensi output yang dilaporkan browser.
function ctxTimeAtPerf(perfMs) {
  let ts = null;
  try { ts = audioCtx.getOutputTimestamp ? audioCtx.getOutputTimestamp() : null; } catch (e) { /* abaikan */ }
  if (ts && ts.performanceTime > 0) return ts.contextTime + (perfMs - ts.performanceTime) / 1000;
  const lat = audioCtx.outputLatency || audioCtx.baseLatency || 0;
  return audioCtx.currentTime + (perfMs - performance.now()) / 1000 - lat;
}

function onClick(m) {
  const line = $("test-line");
  if (!joined) { line.textContent = "Tes Bunyi berjalan. Tap Gabung dulu agar ikut berbunyi."; return; }
  if (!synced()) { line.textContent = "Jam belum sinkron, klik dilewati."; return; }
  if (m.seq === 1) lateClicks = 0;
  const when = ctxTimeAtPerf(m.play_at_ms - clockOffset) + manualOffsetMs / 1000;
  if (when <= audioCtx.currentTime + 0.005) {
    lateClicks++;
  } else {
    const src = audioCtx.createBufferSource();
    src.buffer = clickBuf;
    src.connect(audioCtx.destination);
    src.start(when);
  }
  line.textContent = `Tes klik ${m.seq}/${m.total}` + (lateClicks ? `, terlambat ${lateClicks}` : "");
}

// ---- WebSocket -------------------------------------------------------------
function connect() {
  clearTimeout(retryTimer);
  connected = false;
  setStatus("", "Menyambung…");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "hello", ua: navigator.userAgent, device_id: deviceId() }));
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") return;   // audio biner: mulai M3
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "welcome") {
      retries = 0; connected = true;
      $("device-name").textContent = m.name;
      renderStatus();
      startSync();                               // jam server bisa berbeda tiap sesi/reconnect
    } else if (m.type === "pong") {
      onPong(m);
    } else if (m.type === "click") {
      onClick(m);
    }
  };

  ws.onclose = (ev) => {
    ws = null; connected = false;
    stopSync();
    if (ev.code === 4401) {
      token = null;
      history.replaceState(null, "", "/");
      show("code");
      $("code-error").textContent = "Sesi di PC host sudah berganti. Masukkan kode gabung yang baru.";
      return;
    }
    setStatus("bad", "Terputus, menyambung ulang…");
    const wait = Math.min(5000, 500 * 2 ** retries);
    retries++;
    retryTimer = setTimeout(connect, wait);
  };
}

// ---- Layar kode ------------------------------------------------------------
async function submitCode() {
  const code = $("code").value.replace(/\D/g, "");
  const err = $("code-error");
  if (code.length !== 4) { err.textContent = "Kode harus 4 digit."; return; }
  err.textContent = "";
  $("btn-code").disabled = true;
  let msg = "";
  try {
    const res = await fetch("/api/join?code=" + encodeURIComponent(code), { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.token) {
      token = data.token;
      history.replaceState(null, "", "/?t=" + encodeURIComponent(token));
      start();
      return;
    }
    msg = res.status === 429
      ? `Terlalu banyak percobaan. Coba lagi dalam ${data.retry_after || 60} detik.`
      : "Kode salah. Cek lagi di layar PC host.";
  } catch (e) {
    msg = "PC host tidak terjangkau. Pastikan satu Wi-Fi yang sama.";
  } finally {
    $("btn-code").disabled = false;
  }
  err.textContent = msg;
}

$("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
  if (e.target.value.length === 4) submitCode();
});
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") submitCode(); });
$("btn-code").addEventListener("click", submitCode);

// ---- Tombol Gabung dan Tes Bunyi -------------------------------------------
$("btn-join").addEventListener("click", async () => {
  if (joined) return;
  const btn = $("btn-join");
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("tanpa-audio");
    audioCtx = new AC();
    await audioCtx.resume();
    clickBuf = makeClick(audioCtx);
    joined = true;
    btn.classList.add("on", "ripple");
    $("join-label").textContent = "Bergabung";
    $("btn-test").hidden = false;
    const base = Math.round((audioCtx.baseLatency || 0) * 1000);
    const out = Math.round((audioCtx.outputLatency || 0) * 1000);
    $("info").textContent =
      `AudioContext ${audioCtx.state}, ${audioCtx.sampleRate} Hz, latensi dasar ${base} ms` +
      (out ? `, latensi output ${out} ms.` : ".");
  } catch (e) {
    $("info").textContent = "Browser ini tidak bisa memutar audio. Pakai Chrome atau Edge.";
  }
});

$("btn-test").addEventListener("click", () => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "test" }));
    $("test-line").textContent = "Memulai Tes Bunyi…";
  }
});

function start() {
  if (!token) { show("code"); $("code").focus(); return; }
  show("main");
  connect();
}
start();
</script>
</body>
</html>
