<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e13">
<title>SatuSuara</title>
<style>
:root{
  --bg:#0b0e13; --panel:#131821; --panel2:#19202b;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --text:#eef1f5; --muted:#8a94a4;
  --amber:#ffb547; --hot:#ff7a45; --ok:#4fd18b; --bad:#ff6b5e;
  --r:1.25rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body::before{                                  /* cahaya amber samar di atas, seperti lampu panel */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:radial-gradient(120% 55% at 50% -8%, rgba(255,181,71,.13), transparent 62%);
}
svg.i{width:1.25rem;height:1.25rem;flex:none}

.app{
  min-height:100vh; min-height:100dvh;
  max-width:30rem; margin:0 auto;
  padding:max(1rem,env(safe-area-inset-top)) 1.25rem max(1rem,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:.9rem;
}
.top{display:flex; align-items:center; justify-content:space-between; gap:.75rem}
.brand{display:flex; align-items:center; gap:.55rem; font-weight:700; letter-spacing:-.01em; font-size:1.05rem}
.logo{width:1.9rem; height:1.9rem; color:var(--amber)}
.pill{
  display:inline-flex; align-items:center; gap:.5rem; max-width:62%;
  padding:.35rem .8rem; border-radius:999px; background:var(--panel); border:1px solid var(--line);
  font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums;
}
.pill span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{width:.55rem; height:.55rem; border-radius:50%; background:var(--muted); flex:none}
.dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(79,209,139,.18)}
.dot.bad{background:var(--bad); box-shadow:0 0 0 3px rgba(255,107,94,.18)}

.screen{flex:1; display:flex; flex-direction:column; gap:.9rem}
.eyebrow{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
.who{display:flex; align-items:center; gap:.65rem; flex-wrap:wrap; margin-top:.25rem}
.who h1{margin:0; font-size:2rem; line-height:1.15; font-weight:750; letter-spacing:-.02em}
.chip{
  font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; font-weight:650;
  padding:.2rem .55rem; border-radius:.5rem; border:1px solid var(--line2); color:var(--muted);
}
.muted{color:var(--muted); margin:.35rem 0 0}

.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 34px rgba(0,0,0,.35);
}
.hero{
  position:relative; flex:1 0 auto; min-height:15.5rem; padding:2.4rem 1.25rem; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.9rem;
  background:linear-gradient(180deg,rgba(255,181,71,.05),transparent 55%), var(--panel);
}
.hero.live{flex:0 0 auto; min-height:0; padding:1.2rem 1.1rem 1rem; gap:.7rem}
.caption{margin:0; color:var(--muted); font-size:.92rem; text-align:center}

.join{
  position:relative; width:min(46vw,10.5rem); aspect-ratio:1; border:0; border-radius:50%;
  color:#2b1a00; font:inherit; font-size:1.4rem; font-weight:760; letter-spacing:.005em; cursor:pointer;
  background:radial-gradient(circle at 50% 28%,#ffd37f,#ffae3d 56%,#f39228);
  box-shadow:0 0 0 .55rem rgba(255,181,71,.10), 0 0 0 1.1rem rgba(255,181,71,.05),
             0 16px 36px rgba(255,150,40,.28), inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .12s ease;
}
.join:active{transform:scale(.96)}
.join::before{                                 /* gelombang pelan sebagai ajakan menekan */
  content:""; position:absolute; inset:-.15rem; border-radius:50%;
  border:2px solid rgba(255,181,71,.55); animation:halo 2.8s ease-out infinite;
}
@keyframes halo{0%{transform:scale(.97); opacity:.9} 100%{transform:scale(1.3); opacity:0}}

.viz-wrap{width:100%; display:flex; flex-direction:column; gap:.8rem}
.viz{display:block; width:100%; height:7.25rem}
.viz-cap{margin:0; text-align:center; color:var(--muted); font-size:.85rem; min-height:1.3rem; font-variant-numeric:tabular-nums}

.controls{padding:.95rem 1.1rem 1rem; display:flex; flex-direction:column; gap:.1rem}
.row{display:flex; justify-content:space-between; align-items:center; gap:.75rem; margin-top:.5rem}
.row:first-child{margin-top:0}
.row label{display:flex; align-items:center; gap:.5rem; font-weight:650}
.row label svg{color:var(--amber)}
.row output{color:var(--text); font-variant-numeric:tabular-nums; font-weight:650}
.hint{margin:.1rem 0 .4rem; color:var(--muted); font-size:.85rem}
.tiny{margin:.5rem 0 0; color:var(--muted); font-size:.78rem; font-variant-numeric:tabular-nums}
.sep{height:1px; background:var(--line); margin:.55rem 0 .4rem; border:0}

input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:2.75rem; margin:0; background:transparent;
  --a:0%; --b:50%;
}
input[type=range]::-webkit-slider-runnable-track{
  height:.5rem; border-radius:1rem;
  background:linear-gradient(to right,rgba(255,255,255,.11) 0 var(--a),var(--amber) var(--a) var(--b),rgba(255,255,255,.11) var(--b) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:1.65rem; height:1.65rem; margin-top:-.575rem; border-radius:50%;
  background:#fff; border:4px solid var(--amber); box-shadow:0 2px 8px rgba(0,0,0,.45);
}
input[type=range]::-moz-range-track{height:.5rem; border-radius:1rem; background:rgba(255,255,255,.11)}
input[type=range]::-moz-range-progress{height:.5rem; border-radius:1rem; background:var(--amber)}
input[type=range]::-moz-range-thumb{
  width:1.15rem; height:1.15rem; border-radius:50%; background:#fff; border:4px solid var(--amber);
}
.offrow{display:flex; align-items:center; gap:.5rem}
.step{
  flex:none; width:3.1rem; height:2.75rem; border:1px solid var(--line2); border-radius:.8rem;
  background:var(--panel2); color:var(--text); font:inherit; font-weight:650; cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.step:active{transform:scale(.95)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.55rem; width:100%;
  min-height:3rem; padding:.7rem 1rem; border-radius:.95rem; font:inherit; font-weight:650; cursor:pointer;
  transition:transform .1s ease, background-color .2s ease, color .2s ease;
}
.btn:active{transform:scale(.985)}
.primary{border:0; background:linear-gradient(180deg,#ffc25c,#ffa733); color:#2b1a00; min-height:3.25rem}
.primary:disabled{opacity:.5; cursor:default}
.ghost{border:1px solid var(--line2); background:var(--panel2); color:var(--text)}
.leave{border:1px solid rgba(255,107,94,.38); background:transparent; color:var(--bad)}
.leave.armed{background:var(--bad); border-color:var(--bad); color:#2a0905}
.foot{margin-top:auto; display:flex; flex-direction:column; gap:.5rem; padding-top:.25rem}
.foot .hintline{margin:0; text-align:center; color:var(--muted); font-size:.8rem; min-height:1.2rem}

/* layar kode */
.codebox{position:relative; margin-top:.5rem}
.code-input{
  position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0;
  font-size:16px; cursor:text;
}
.cells{display:grid; grid-template-columns:repeat(4,1fr); gap:.65rem}
.cell{
  height:4.4rem; border-radius:1.05rem; background:var(--panel); border:1px solid var(--line2);
  display:grid; place-items:center; font-size:2.1rem; font-weight:720; font-variant-numeric:tabular-nums;
}
.codebox:focus-within .cell.active{border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,181,71,.2)}
.error{min-height:1.5rem; margin:.1rem 0 0; color:var(--bad); font-size:.92rem}

/* layar putus */
.ended{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:.9rem; padding:1rem 0 2rem}
.ended .badge{
  width:5.2rem; height:5.2rem; border-radius:50%; display:grid; place-items:center;
  background:var(--panel); border:1px solid var(--line2); color:var(--muted);
  box-shadow:0 0 0 .6rem rgba(255,255,255,.03);
}
.ended .badge svg{width:2.2rem; height:2.2rem}
.ended h1{margin:.4rem 0 0; font-size:1.65rem; font-weight:750; letter-spacing:-.02em}
.ended p{margin:0; color:var(--muted); max-width:22rem}
.ended .btn{max-width:20rem; margin-top:.6rem}

button:focus-visible, input:focus-visible{outline:3px solid var(--text); outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .join::before{animation:none; opacity:0}
  .join,.btn,.step{transition:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.6a5 5 0 0 1 0 6.8M18.7 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13.2" r="7.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 9.2v4.2l2.6 1.8M9.6 3h4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.2v8M6.9 6.9a7.4 7.4 0 1 0 10.2 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-tap" viewBox="0 0 24 24"><path d="M5 14.5a7 7 0 0 1 14 0M8.4 14.5a3.6 3.6 0 0 1 7.2 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="14.5" r="1.3" fill="currentColor"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="3.2" fill="currentColor"/><path d="M9.5 9.5a9.2 9.2 0 0 0 0 13M22.5 9.5a9.2 9.2 0 0 1 0 13M5 5a15.5 15.5 0 0 0 0 22M27 5a15.5 15.5 0 0 1 0 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>SatuSuara</span>
    </div>
    <div class="pill" role="status"><span id="dot" class="dot"></span><span id="status-text">Menyambung…</span></div>

  <section id="screen-code" class="screen" hidden>

      <p class="muted">Kode 4 digit tampil di layar PC host.</p>
    </div>
    <div class="codebox" id="codebox">
      <input id="code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*"

      </div>

    <button id="btn-code" class="btn primary" type="button">Masuk</button>
  </section>

  <section id="screen-main" class="screen" hidden>
    <div>
      <div class="eyebrow">Perangkat ini</div>
      <div class="who">
        <h1 id="device-name">&nbsp;</h1>
      </div>
    </div>

    <div id="hero" class="card hero">
      <div id="join-wrap" style="display:contents">
        <button id="btn-join" class="join" type="button"><span id="join-label">Gabung</span></button>
        <p class="caption">Tap untuk mulai mendengarkan</p>
      </div>
      <div id="viz-wrap" class="viz-wrap" hidden>
        <canvas id="viz" class="viz" role="img" aria-label="Pemeter level suara yang sedang diputar"></canvas>
        <p id="stream-line" class="viz-cap" role="status"></p>

    <div id="controls" class="card controls" hidden>
      <div class="row">
        <label for="vol"><svg class="i"><use href="#i-vol"/></svg>Volume</label>
        <output id="vol-out" for="vol">80%</output>

        <input id="off" type="range" min="-300" max="300" step="1" value="0">
        <button id="off-plus" class="step" type="button" aria-label="Tambah offset 5 milidetik">+5</button>
      </div>
      <p class="hint">Suara perangkat ini terdengar terlambat? Geser ke minus. Terlalu cepat? Geser ke plus.</p>
      <button id="btn-test" class="btn ghost" type="button">Tes Bunyi</button>

      <p id="info" class="tiny" role="status"></p>

    <div class="foot">

</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// localStorage bisa gagal (mode privat, dll). Selalu bungkus.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* abaikan */ } },
};

// Halaman jalan di http:// LAN (bukan secure context): crypto.randomUUID tidak ada,
// getRandomValues tetap ada.
function deviceId() {
  let id = store.get("ss_device_id");
  if (!id) {
    const b = new Uint8Array(8);
    crypto.getRandomValues(b);
    id = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    store.set("ss_device_id", id);
  }
  return id;
}

let token = new URLSearchParams(location.search).get("t");
let ws = null, retries = 0, retryTimer = null;
let joined = false, audioCtx = null, clickBuf = null, masterGain = null;
// Siaran audio (M3)
const HDR = 13, GAPLESS_TOL = 0.015;
let nextStart = 0, lastSeq = -1, lastAudioAt = 0, chunksPlayed = 0, lateChunks = 0;
// Volume/mute dari dashboard host (berlaku di atas slider volume lokal)
let remoteVolume = 100, remoteMuted = false;
let connected = false;
let analyser = null, userStopped = false;

// ---- Sinkron jam (PRD 8.2) -------------------------------------------------
// Jam server = performance.now() + clockOffset (semua dalam ms).
const MAX_SAMPLES = 24, MIN_SAMPLES = 5, BURST = 15;
let samples = [], clockOffset = null, bestRtt = null;
let burstTimer = null, pingTimer = null;
function loadInt(key, def, lo, hi) {
  const v = parseInt(store.get(key), 10);
  return Number.isNaN(v) ? def : Math.min(hi, Math.max(lo, v));
}
// Positif = putar lebih lambat, negatif = lebih cepat. Tersimpan per perangkat (localStorage).
let manualOffsetMs = loadInt("ss_offset_ms", 0, -300, 300);
let volume = loadInt("ss_volume", 80, 0, 100);
let lateClicks = 0;

function stopSync() {
  clearInterval(burstTimer); clearInterval(pingTimer);
  burstTimer = pingTimer = null;
}

function sendPing() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping", t0: performance.now() }));
}

function startSync() {
  stopSync();
  samples = []; clockOffset = null; bestRtt = null;
  let n = 0;
  burstTimer = setInterval(() => {
    sendPing();
    if (++n >= BURST) {
      clearInterval(burstTimer); burstTimer = null;
      pingTimer = setInterval(sendPing, 5000);
    }
  }, 60);
}

function onPong(m) {
  const t1 = performance.now();
  const rtt = t1 - m.t0;
  if (!(rtt >= 0 && rtt < 2000)) return;
  samples.push({ rtt, offset: m.ts + rtt / 2 - t1 });
  if (samples.length > MAX_SAMPLES) samples.shift();

  // Ambil 3 sampel ber-RTT terkecil (paling sedikit terganggu jitter), rata-ratakan offsetnya.
  const best = samples.slice().sort((a, b) => a.rtt - b.rtt).slice(0, 3);
  const target = best.reduce((s, x) => s + x.offset, 0) / best.length;
  bestRtt = best[0].rtt;
  if (clockOffset === null || Math.abs(target - clockOffset) > 100) clockOffset = target;
  else clockOffset += 0.3 * (target - clockOffset);   // haluskan agar tidak melompat
  renderStatus();
}

function synced() { return clockOffset !== null && samples.length >= MIN_SAMPLES; }

// ---- Status ----------------------------------------------------------------
function setStatus(kind, text) {
  $("dot").className = "dot " + kind;
  $("status-text").textContent = text;
}

function renderStatus() {
  if (!connected) return;
  if (synced()) setStatus("ok", `Sinkron ±${Math.max(1, Math.round(bestRtt / 2))} ms`);
  else setStatus("ok", "Tersambung, menyinkronkan jam…");
}

function show(name) {
  $("screen-code").hidden = name !== "code";
  $("screen-main").hidden = name !== "main";
  $("screen-ended").hidden = name !== "ended";
}

// ---- Audio: klik terjadwal -------------------------------------------------
function makeClick(ctx) {
  const sr = ctx.sampleRate, n = Math.floor(sr * 0.03);
  const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    const t = i / sr;
    d[i] = Math.sin(2 * Math.PI * 1800 * t) * Math.exp(-t / 0.004) * 0.9;
  }
  return buf;
}

// Ubah waktu perf (ms) saat suara harus KELUAR dari speaker menjadi waktu AudioContext.
// getOutputTimestamp() sudah memperhitungkan latensi output yang dilaporkan browser.
function ctxTimeAtPerf(perfMs) {
  let ts = null;
  try { ts = audioCtx.getOutputTimestamp ? audioCtx.getOutputTimestamp() : null; } catch (e) { /* abaikan */ }
  if (ts && ts.performanceTime > 0) return ts.contextTime + (perfMs - ts.performanceTime) / 1000;
  const lat = audioCtx.outputLatency || audioCtx.baseLatency || 0;
  return audioCtx.currentTime + (perfMs - performance.now()) / 1000 - lat;
}

function onClick(m) {
  const line = $("test-line");
  if (!joined) { line.textContent = "Tes Bunyi berjalan. Tap Gabung dulu agar ikut berbunyi."; return; }
  if (!synced()) { line.textContent = "Jam belum sinkron, klik dilewati."; return; }
  if (m.seq === 1) lateClicks = 0;
  const when = ctxTimeAtPerf(m.play_at_ms - clockOffset) + manualOffsetMs / 1000;
  if (when <= audioCtx.currentTime + 0.005) {
    lateClicks++;
  } else {
    const src = audioCtx.createBufferSource();
    src.buffer = clickBuf;
    src.connect(masterGain);
    src.start(when);
  }
  line.textContent = `Tes klik ${m.seq}/${m.total}` + (lateClicks ? `, terlambat ${lateClicks}` : "");
}

// ---- Audio PC: chunk 40 ms terjadwal berantai ------------------------------
// Pesan biner: [u8 tipe=1][u32 seq][f64 play_at_ms][PCM s16le stereo 48 kHz], little-endian.
function onAudio(buf) {
  lastAudioAt = performance.now();
  if (!joined || !synced() || buf.byteLength <= HDR) return;
  const dv = new DataView(buf);
  if (dv.getUint8(0) !== 1) return;
  const seq = dv.getUint32(1, true);
  const playAt = dv.getFloat64(5, true);

  const ideal = ctxTimeAtPerf(playAt - clockOffset) + manualOffsetMs / 1000;
  let when = ideal;
  // Berantai tanpa celah: jika chunk ini sambungan langsung dan selisih wajar, mulai tepat di akhir chunk sebelumnya.
  if (lastSeq >= 0 && seq === ((lastSeq + 1) >>> 0) && Math.abs(ideal - nextStart) < GAPLESS_TOL) when = nextStart;
  if (when < audioCtx.currentTime + 0.005) {   // sudah lewat: buang, lebih baik hilang 40 ms
    lateChunks++; lastSeq = -1; return;
  }

  const frames = (buf.byteLength - HDR) >> 2;  // 2 kanal x 2 byte
  const pcm = new Int16Array(buf.slice(HDR));  // salinan: offset 13 tidak rata untuk Int16Array
  const ab = audioCtx.createBuffer(2, frames, 48000);
  const l = ab.getChannelData(0), r = ab.getChannelData(1);
  for (let i = 0, j = 0; i < frames; i++, j += 2) { l[i] = pcm[j] / 32768; r[i] = pcm[j + 1] / 32768; }
  const src = audioCtx.createBufferSource();
  src.buffer = ab;
  src.connect(masterGain);
  src.start(when);
  nextStart = when + frames / 48000;
  lastSeq = seq;
  chunksPlayed++;
}

function renderStream() {
  const el = $("stream-line");
  if (!joined) { el.textContent = ""; return; }
  if (!lastAudioAt || performance.now() - lastAudioAt > 2000) {
    el.textContent = "Menunggu audio dari PC host. Putar sesuatu di PC host (YouTube, Spotify, dll).";
    return;
  }
  const buf = Math.max(0, Math.round((nextStart - audioCtx.currentTime) * 1000));
  el.textContent = `Menerima audio: buffer ${buf} ms, dilewati ${lateChunks}`;
}
setInterval(renderStream, 500);

// ---- WebSocket -------------------------------------------------------------
function connect() {
  if (userStopped) return;
  clearTimeout(retryTimer);
  connected = false;
  setStatus("", "Menyambung…");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?t=${encodeURIComponent(token)}`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "hello", ua: navigator.userAgent, device_id: deviceId() }));
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data !== "string") { onAudio(ev.data); return; }
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === "welcome") {
      retries = 0; connected = true;
      lastSeq = -1; nextStart = 0;
      applyControl(m);                           // volume/mute yang diingat host untuk perangkat ini
      $("device-name").textContent = m.name;
      renderStatus();
      startSync();                               // jam server bisa berbeda tiap sesi/reconnect
    } else if (m.type === "pong") {
      onPong(m);
    } else if (m.type === "click") {
      onClick(m);
    } else if (m.type === "control") {
      applyControl(m);
    }
  };

  ws.onclose = (ev) => {
    ws = null; connected = false; lastSeq = -1;
    stopSync();
    if (ev.code === 4403) {                       // diputus oleh PC host: jangan menyambung otomatis
      teardown();
      showEnded("host");
      return;
    }
    if (ev.code === 4401) {
      token = null;
      history.replaceState(null, "", "/");
      setStatus("", "Belum tersambung");
      show("code");
      $("code-error").textContent = "Sesi di PC host sudah berganti. Masukkan kode gabung yang baru.";
      return;
    }
    setStatus("bad", "Terputus, menyambung ulang…");
    const wait = Math.min(5000, 500 * 2 ** retries);
    retries++;
    retryTimer = setTimeout(connect, wait);
  };
}

// ---- Layar kode ------------------------------------------------------------
async function submitCode() {
  const code = $("code").value.replace(/\D/g, "");
  const err = $("code-error");
  if (code.length !== 4) { err.textContent = "Kode harus 4 digit."; return; }
  err.textContent = "";
  $("btn-code").disabled = true;
  let msg = "";
  try {
    const res = await fetch("/api/join?code=" + encodeURIComponent(code), { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.token) {
      token = data.token;
      history.replaceState(null, "", "/?t=" + encodeURIComponent(token));
      start();
      return;
    }
    msg = res.status === 429
      ? `Terlalu banyak percobaan. Coba lagi dalam ${data.retry_after || 60} detik.`
      : "Kode salah. Cek lagi di layar PC host.";
  } catch (e) {
    msg = "PC host tidak terjangkau. Pastikan satu Wi-Fi yang sama.";
  } finally {
    $("btn-code").disabled = false;
  }
  err.textContent = msg;
}

function renderCells() {
  const v = $("code").value, cells = document.querySelectorAll(".cell");
  cells.forEach((c, i) => {
    c.textContent = v[i] || "";
    c.classList.toggle("active", i === Math.min(v.length, 3));
  });
}
$("code").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
  renderCells();
  if (e.target.value.length === 4) submitCode();
});
$("code").addEventListener("focus", renderCells);
$("codebox").addEventListener("pointerdown", () => $("code").focus());
renderCells();
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") submitCode(); });
$("btn-code").addEventListener("click", submitCode);

// ---- Tombol Gabung dan Tes Bunyi -------------------------------------------
$("btn-join").addEventListener("click", async () => {
  if (joined) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error("tanpa-audio");
    audioCtx = new AC();
    await audioCtx.resume();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = effectiveGain();
    if (audioCtx.createAnalyser) {               // pemeter LED membaca audio yang benar-benar keluar
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.6;
      analyser.minDecibels = -90; analyser.maxDecibels = -20;
      viz.data = new Uint8Array(analyser.frequencyBinCount);
      masterGain.connect(analyser);
      analyser.connect(audioCtx.destination);
    } else {
      masterGain.connect(audioCtx.destination);
    }
    clickBuf = makeClick(audioCtx);
    joined = true;
    $("join-label").textContent = "Bergabung";
    $("join-wrap").hidden = true;
    $("viz-wrap").hidden = false;
    $("controls").hidden = false;
    $("hero").classList.add("live");
    startViz();
    const base = Math.round((audioCtx.baseLatency || 0) * 1000);
    const out = Math.round((audioCtx.outputLatency || 0) * 1000);
    $("info").textContent =
      `AudioContext ${audioCtx.state}, ${audioCtx.sampleRate} Hz, latensi dasar ${base} ms` +
      (out ? `, latensi output ${out} ms.` : ".");
  } catch (e) {
    $("info").textContent = "Browser ini tidak bisa memutar audio. Pakai Chrome atau Edge.";
  }
});

$("btn-test").addEventListener("click", () => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "test" }));
    $("test-line").textContent = "Memulai Tes Bunyi…";
  }
});

// ---- Volume dan offset (C-05, C-06) ----------------------------------------
function effectiveGain() {
  const local = Math.pow(volume / 100, 2);
  const remote = remoteMuted ? 0 : Math.pow(remoteVolume / 100, 2);
  return local * remote;
}

function applyControl(m) {
  const v = Number(m.volume);
  remoteVolume = Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 100;
  remoteMuted = !!m.muted;
  if (masterGain) masterGain.gain.setTargetAtTime(effectiveGain(), audioCtx.currentTime, 0.02);
  $("remote-line").textContent = remoteMuted ? "Dibisukan dari PC host."
    : remoteVolume < 100 ? `Volume dari PC host: ${remoteVolume}%.` : "";
}

function fmtOffset(v) { return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v) + " ms"; }

function paint(el) {                              // isi track slider: dari kiri (volume) atau dari tengah (offset)
  const lo = +el.min, hi = +el.max, p = ((+el.value - lo) / (hi - lo)) * 100;
  const centered = lo < 0;
  el.style.setProperty("--a", (centered ? Math.min(p, 50) : 0) + "%");
  el.style.setProperty("--b", (centered ? Math.max(p, 50) : p) + "%");
}

function setOffset(v) {
  manualOffsetMs = Math.min(300, Math.max(-300, Math.round(v)));
  $("off").value = manualOffsetMs;
  paint($("off"));
  $("off-out").textContent = fmtOffset(manualOffsetMs);
  store.set("ss_offset_ms", String(manualOffsetMs));
  lastSeq = -1;   // jangkar ulang rantai audio agar offset baru berlaku
}

function setVolume(v) {
  volume = Math.min(100, Math.max(0, Math.round(v)));
  $("vol").value = volume;
  paint($("vol"));
  $("vol-out").textContent = volume + "%";
  store.set("ss_volume", String(volume));
  if (masterGain) masterGain.gain.setTargetAtTime(effectiveGain(), audioCtx.currentTime, 0.02);
}

$("off").addEventListener("input", (e) => setOffset(+e.target.value));
$("off-minus").addEventListener("click", () => setOffset(manualOffsetMs - 5));
$("off-plus").addEventListener("click", () => setOffset(manualOffsetMs + 5));
$("vol").addEventListener("input", (e) => setVolume(+e.target.value));
setOffset(manualOffsetMs);
setVolume(volume);

function start() {
  userStopped = false;
  if (!token) { setStatus("", "Belum tersambung"); show("code"); $("code").focus(); return; }
  show("main");
  connect();
}

// ---- Pemeter LED (canvas) --------------------------------------------------
const COLS = 18, ROWS = 12;
const viz = { canvas: $("viz"), ctx: null, raf: 0, last: 0, data: null, levels: new Float32Array(COLS) };

function sizeViz() {
  const c = viz.canvas, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return 0;
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  return dpr;
}

function drawViz(ts) {
  viz.raf = requestAnimationFrame(drawViz);
  if (ts - viz.last < 33) return;                // ~30 fps cukup, hemat baterai HP
  viz.last = ts;
  const dpr = sizeViz();
  if (!dpr || !viz.ctx) return;
  const lv = viz.levels;
  if (analyser && viz.data) {
    analyser.getByteFrequencyData(viz.data);
    const n = viz.data.length, lo = 1, hi = Math.max(4, Math.floor(n * 0.75));
    for (let i = 0; i < COLS; i++) {             // pita frekuensi berskala logaritmik
      const a = Math.floor(lo * Math.pow(hi / lo, i / COLS));
      const b = Math.max(a + 1, Math.floor(lo * Math.pow(hi / lo, (i + 1) / COLS)));
      let sum = 0;
      for (let k = a; k < b; k++) sum += viz.data[k];
      const v = Math.min(1, (sum / (b - a) / 255) * 1.2);
      lv[i] = v > lv[i] ? v : Math.max(v, lv[i] - 0.06);   // naik cepat, turun pelan
    }
  } else {
    for (let i = 0; i < COLS; i++) lv[i] = Math.max(0, lv[i] - 0.06);
  }
  const ctx = viz.ctx, W = viz.canvas.width, H = viz.canvas.height;
  const gap = 3 * dpr, colW = (W - gap * (COLS - 1)) / COLS, segH = (H - gap * (ROWS - 1)) / ROWS;
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < COLS; i++) {
    const lit = Math.round(lv[i] * ROWS), x = i * (colW + gap);
    for (let r = 0; r < ROWS; r++) {
      ctx.fillStyle = r >= lit ? "rgba(255,255,255,.06)"
        : r >= ROWS - 3 ? "#ff7a45" : r >= ROWS - 5 ? "#ffa23f" : "#ffb547";
      ctx.fillRect(x, H - (r + 1) * segH - r * gap, colW, segH);
    }
  }
}

function startViz() {
  if (viz.raf) return;
  if (!viz.ctx) { try { viz.ctx = viz.canvas.getContext("2d"); } catch (e) { viz.ctx = null; } }
  if (viz.ctx) viz.raf = requestAnimationFrame(drawViz);
}
function stopViz() {
  cancelAnimationFrame(viz.raf);
  viz.raf = 0; viz.levels.fill(0); viz.data = null;
}

// ---- Putuskan koneksi ------------------------------------------------------
// Hentikan audio dan semua pewaktu, kembalikan tampilan utama ke keadaan awal (belum Gabung).
function teardown() {
  stopSync();
  clearTimeout(retryTimer); retryTimer = null;
  stopViz();
  if (audioCtx) { try { audioCtx.close(); } catch (e) { /* abaikan */ } }
  audioCtx = null; masterGain = null; analyser = null; clickBuf = null;
  joined = false; connected = false;
  lastSeq = -1; nextStart = 0; lastAudioAt = 0;
  $("join-wrap").hidden = false; $("viz-wrap").hidden = true; $("controls").hidden = true;
  $("hero").classList.remove("live");
  $("join-label").textContent = "Gabung";
  for (const id of ["info", "stream-line", "test-line", "remote-line"]) $(id).textContent = "";
  setStatus("", "Menyambung…");
}

function showEnded(who) {
  const byHost = who === "host";
  $("ended-title").textContent = byHost ? "Diputus oleh PC host" : "Koneksi diputus";
  $("ended-text").textContent = byHost
    ? "PC host memutuskan perangkat ini, jadi suara berhenti. Kamu bisa menyambung lagi kapan saja."
    : "Kamu memutuskan koneksi dari PC host, jadi suara berhenti di perangkat ini.";
  setStatus("bad", byHost ? "Diputus host" : "Terputus");
  show("ended");
  $("btn-reconnect").focus();
}

function leave() {
  userStopped = true;
  const sock = ws; ws = null;
  if (sock) { sock.onclose = null; try { sock.close(1000, "keluar"); } catch (e) { /* abaikan */ } }
  teardown();
  showEnded("user");
}

// Dua langkah agar tidak terpencet: tap pertama "mempersenjatai" tombol selama 3 detik.
(function () {
  const btn = $("btn-leave"), lbl = btn.querySelector(".lbl");
  let timer = null;
  const disarm = () => { clearTimeout(timer); timer = null; btn.classList.remove("armed"); lbl.textContent = btn.dataset.idle; };
  btn.addEventListener("click", () => {
    if (btn.classList.contains("armed")) { disarm(); leave(); return; }
    btn.classList.add("armed");
    lbl.textContent = btn.dataset.armed;
    timer = setTimeout(disarm, 3000);
  });
})();

$("btn-reconnect").addEventListener("click", start);
start();
</script>
