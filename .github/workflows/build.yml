name: Build SatuSuara EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Ambil kode dari repositori
        uses: actions/checkout@v6

      - name: 2. Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 3. Instal library project dan PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 4. Ubah project menjadi file .exe
        run: |
          pyinstaller --noconfirm --onefile --console `
            --name SatuSuara `
            --add-data "web;web" `
            --collect-submodules uvicorn `
            --collect-all pyaudiowpatch `
            --hidden-import websockets `
            run.py

      - name: 5. Catat SHA256 hasil build
        shell: pwsh
        run: Get-FileHash dist/SatuSuara.exe -Algorithm SHA256 | Format-List

      - name: 6. Simpan hasil SatuSuara.exe agar bisa diunduh
        uses: actions/upload-artifact@v7
        with:
          name: SatuSuara-Windows
          path: dist/SatuSuara.exe
          if-no-files-found: error
